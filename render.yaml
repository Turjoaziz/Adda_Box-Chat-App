services:
  - type: web
    name: adda-box-chat-app
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://adda-box-chat-app.onrender.com
      - key: PASSWORD_RESET_BASE_URL
        value: https://adda-box-chat-app.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESET_EMAIL_FROM
        sync: false
