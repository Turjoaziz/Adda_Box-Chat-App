name: Safe production audit fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --package-lock-only

      - name: Install exact dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify production audit
        run: npm audit --omit=dev || true

      - name: Commit safe lockfile fixes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply safe npm audit fixes"
          git push
