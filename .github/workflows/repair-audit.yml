name: Repair production dependency audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-audit.yml

permissions:
  contents: write

jobs:
  repair-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show current production audit
        run: npm audit --omit=dev || true

      - name: Apply non-breaking audit fix
        run: npm audit fix --package-lock-only

      - name: Install exact dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify production audit is clean
        run: npm audit --omit=dev

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: repair critical dependency audit"
          git push
