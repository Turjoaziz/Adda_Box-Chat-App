name: Add Nodemailer dependency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-nodemailer.yml

permissions:
  contents: write

jobs:
  add-nodemailer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Nodemailer
        run: npm install nodemailer@latest --save

      - name: Run tests
        run: npm test

      - name: Verify audit
        run: npm audit --omit=dev

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add nodemailer for gmail smtp"
          git push
